<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Admin — Baú de Canecas</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Tela de login — some depois de autenticar -->
  <div class="login-screen" id="loginScreen">
    <form class="login-box" id="loginForm">
      <div class="wordmark">
        <span class="wordmark-main">Painel</span>
        <span class="wordmark-accent">Admin</span>
      </div>
      <label class="field">
        <span>E-mail</span>
        <input type="email" id="loginEmail" required autocomplete="username">
      </label>
      <label class="field">
        <span>Senha</span>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </label>
      <button type="submit" class="primary-btn" id="loginBtn">Entrar</button>
      <p class="form-error" id="loginError" hidden></p>
    </form>
  </div>

  <!-- Painel — só aparece autenticado -->
  <div id="adminPanel" hidden>
    <header class="admin-topbar">
      <div class="wordmark">
        <span class="wordmark-main">Painel</span>
        <span class="wordmark-accent">Admin</span>
      </div>
      <button type="button" id="logoutBtn" class="ghost-btn ghost-btn--onDark">Sair</button>
    </header>

    <main class="admin-main">

      <!-- Lista de cards -->
      <section class="panel">
        <div class="panel-header-row">
          <h2 class="panel-title">Cards no catálogo</h2>
          <span id="cardCount" class="card-count">0 cards</span>
        </div>
        <div id="cardList" class="card-list">
          <p class="list-empty" id="listEmpty">Carregando...</p>
        </div>
      </section>

      <!-- Formulário adicionar/editar -->
      <section class="panel">
        <h2 class="panel-title" id="formTitle">Adicionar novo card</h2>
        <form id="cardForm" class="card-form">
          <div class="field-row">
            <label class="field">
              <span>Código</span>
              <input type="text" id="fieldCode" placeholder="CN-009" required>
            </label>
            <label class="field">
              <span>Preço (R$)</span>
              <input type="number" id="fieldPrice" step="0.01" min="0" placeholder="49.90" required>
            </label>
          </div>

          <label class="field">
            <span>Nome</span>
            <input type="text" id="fieldName" placeholder="Caneca Signo do Zodíaco" required>
          </label>

          <label class="field">
            <span>Descrição</span>
            <textarea id="fieldDesc" rows="2" placeholder="Ilustração minimalista do signo, acabamento fosco." required></textarea>
          </label>

          <label class="field">
            <span>Cor de destaque (usada se a foto não carregar)</span>
            <input type="color" id="fieldColor" value="#1F4B4C">
          </label>

          <label class="field">
            <span>Foto do produto</span>
            <input type="file" id="fieldImageFile" accept="image/*">
            <input type="hidden" id="fieldImageUrl">
          </label>

          <div class="image-preview-row" id="imagePreviewRow" hidden>
            <img id="imagePreview" alt="Pré-visualização">
            <span id="imageUploadStatus" class="upload-status"></span>
          </div>

          <div class="form-actions">
            <button type="submit" id="formSubmitBtn" class="primary-btn">Adicionar card</button>
            <button type="button" id="formCancelBtn" class="ghost-btn" hidden>Cancelar edição</button>
          </div>
          <p class="form-error" id="formError" hidden></p>
        </form>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
